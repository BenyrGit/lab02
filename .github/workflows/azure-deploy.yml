name: CI/CD Azure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installer les dependances du backend
        run: npm ci --prefix backend

      - name: Tester le backend
        run: npm test --prefix backend

      - name: Installer les dependances du frontend
        run: npm ci --prefix frontend

      - name: Construire le frontend
        run: npm run build --prefix frontend

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci
    environment : prpojet1

    steps:
      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deployer sur Azure
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            cd "${{ vars.APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev --prefix backend
            npm ci --prefix frontend
            npm run build --prefix frontend
            sudo -n /usr/bin/systemctl restart projet1.service
          '

      - name: Smoke test
        run: |
          curl -fsS "${{ vars.APP_URL }}"
          curl -fsS "${{ vars.APP_URL }}/api/health"
